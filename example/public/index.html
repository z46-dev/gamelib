<!DOCTYPE html>
<html lang="en">

<head>
    <title>gamelib example</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
    <script src="./wasm_exec.js" defer></script>
</head>

<body oncontextmenu="return;">
    <canvas id="canvas"></canvas>
    <script defer>
        document.addEventListener("DOMContentLoaded", () => {
            const go = new Go();
            WebAssembly.instantiateStreaming(fetch("./main.wasm"), go.importObject).then(result => go.run(result.instance));
        });
    </script>
</body>

</html>
